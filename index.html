<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rayy Enterprise</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#f4f4f4;
}

header{
background:#111;
color:white;
padding:20px;
text-align:center;
}

header h1{
font-size:38px;
color:#ff3b3b;
}

nav{
margin-top:15px;
}

nav a{
color:white;
text-decoration:none;
margin:15px;
font-size:18px;
}

.hero{
padding:80px 20px;
text-align:center;
background:linear-gradient(135deg,#111,#ff0000);
color:white;
}

.hero h2{
font-size:42px;
margin-bottom:15px;
}

.hero p{
font-size:20px;
}

.btn{
display:inline-block;
margin-top:30px;
padding:15px 35px;
background:white;
color:red;
font-weight:bold;
border-radius:40px;
text-decoration:none;
}

.products{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:20px;
padding:40px;
}

.card{
background:white;
border-radius:15px;
padding:20px;
box-shadow:0 5px 15px rgba(0,0,0,.1);
text-align:center;
}

.card img{
width:100%;
height:180px;
object-fit:cover;
border-radius:10px;
}

.card h3{
margin:15px 0;
}

footer{
background:#111;
color:white;
text-align:center;
padding:20px;
margin-top:30px;
}
</style>

</head>
<body>

<header>
<h1>Rayy Enterprise</h1>

<nav>
<a href="#">Home</a>
<a href="#">Shop</a>
<a href="#">Categories</a>
<a href="#">About</a>
<a href="#">Contact</a>
</nav>

</header>

<section class="hero">

<h2>Myanmar Online Shopping Marketplace</h2>

<p>Fashion • Electronics • Mobile Phones • Beauty • Home</p>

<a class="btn" href="#">Shop Now</a>

</section>

<section class="products">

<div class="card">
<img src="https://picsum.photos/300/200?1">
<h3>Smart Phone</h3>
<p>Best Price</p>
</div>

<div class="card">
<img src="https://picsum.photos/300/200?2">
<h3>Fashion</h3>
<p>New Collection</p>
</div>

<div class="card">
<img src="https://picsum.photos/300/200?3">
<h3>Electronics</h3>
<p>Latest Products</p>
</div>

<div class="card">
<img src="https://picsum.photos/300/200?4">
<h3>Beauty</h3>
<p>Best Seller</p>
</div>

</section>

<footer>

© 2023 Rayy Enterprise

</footer>

</body>
</html>
